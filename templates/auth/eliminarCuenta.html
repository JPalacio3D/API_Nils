{% extends './base.html' %}
{% block title %}Eliminar Cuenta{% endblock title %}

{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
{% endblock customCSS %}

{% block body %}
<form class="form-delete" action="/delete" method="POST">
    <img class="mb-4 icono" src="{{ url_for('static', filename='img/Peri-car.png') }}" alt="" width="300" height="300">
    <h1 class="h3 mb-3 fw-normal">Eliminar Cuenta</h1>

    <div class="form-floating">
      <input type="username" class="form-control" id="username" name="username" placeholder="Nombre de usuario">
      <label for="username">Usuario</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña">
      <label for="password">Contraseña</label>
    </div>
    <button class="btn btn-primary w-100 py-2" type="submit">Eliminar Cuenta</button>
  </form>
{% endblock body %}
